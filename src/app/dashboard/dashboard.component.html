<mat-sidenav-container class="sidenav-container d-flex">
  <mat-sidenav #drawer class="sidenav" [mode]="sidenavMode" [opened]="sidenavOpened">
    <div class="sidenav-inner">
      <div class="brand-header">
        <img src="assets/logo.png" alt="SC Dental" class="brand-logo">
        <div class="brand-subtitle">Panel de administración</div>
      </div>

      <div class="nav-items">
        <a class="nav-link" routerLink="turnos" routerLinkActive="active" (click)="closeDrawer()">
          <span class="emoji">📅</span>
          <span>Turnos</span>
        </a>
        <a class="nav-link" routerLink="pacientes" routerLinkActive="active" (click)="closeDrawer()">
          <span class="emoji">👥</span>
          <span>Pacientes</span>
        </a>
        <a class="nav-link" routerLink="odontologos" routerLinkActive="active" (click)="closeDrawer()">
          <span class="emoji">🦷</span>
          <span>Odontólogos</span>
        </a>
        <a class="nav-link" routerLink="obras-sociales" routerLinkActive="active" (click)="closeDrawer()">
          <span class="emoji">📄</span>
          <span>Obras Sociales</span>
        </a>
        <a class="nav-link" routerLink="historial" routerLinkActive="active" (click)="closeDrawer()">
          <span class="emoji">📝</span>
          <span>Historial</span>
        </a>
        <a class="nav-link" routerLink="whatsapp" routerLinkActive="active" (click)="closeDrawer()">
          <span class="emoji">💬</span>
          <span>WhatsApp</span>
        </a>
      </div>

      <div class="logout-container">
        <button mat-button class="logout-button" (click)="logout(); closeDrawer()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <div class="mobile-toolbar">
      <button mat-icon-button (click)="drawer.toggle()" class="menu-button">
        <mat-icon>menu</mat-icon>
      </button>
    </div>

    <div class="main-content p-3">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

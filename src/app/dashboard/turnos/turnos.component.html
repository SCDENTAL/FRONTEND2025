<div class="turnos-container">

  <div class="acciones-calendario">
    <mat-form-field appearance="outline" class="select-calendario">
      <mat-label>Seleccionar calendario</mat-label>
      <mat-select [(value)]="calendario" (selectionChange)="seleccionarCalendario($event.value)">
        <mat-option *ngFor="let cal of calendarios" [value]="cal">
          {{ cal.nombre }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-raised-button class="btn-acciones" [matMenuTriggerFor]="menuCalendario">
      <mat-icon>settings</mat-icon>
      Acciones
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #menuCalendario="matMenu">
      <button mat-menu-item (click)="abrirDialogoCrearCalendario()">
        <mat-icon>add_circle_outline</mat-icon>
        <span>Crear calendario</span>
      </button>
      <button mat-menu-item (click)="extenderCalendario()" [disabled]="!calendario">
        <mat-icon>date_range</mat-icon>
        <span>Extender calendario</span>
      </button>
      <button mat-menu-item (click)="eliminarCalendario()" [disabled]="!calendario" class="menu-eliminar">
        <mat-icon>delete_outline</mat-icon>
        <span>Eliminar calendario</span>
      </button>
    </mat-menu>
  </div>

  <div *ngIf="!cargando && calendario" class="calendario-wrapper">
    <app-calendario [calendarioId]="calendario.id" [highlightFecha]="highlightFecha" [highlightHorario]="highlightHorario"></app-calendario>
  </div>

  <div *ngIf="!cargando && !calendario" class="sin-calendario">
    No hay calendarios disponibles. Crea uno para empezar.
  </div>

</div>

<div class="empleados-container">
  <div class="toolbar-header">
    <div class="toolbar-left">
      <h1>Odontólogos</h1>
      <span class="badge-count">{{ dataSource.filteredData.length }}</span>
    </div>
    <div class="toolbar-right">
      <mat-form-field appearance="outline" class="buscador">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="aplicarFiltro($event)" placeholder="Buscar odontólogo...">
      </mat-form-field>
      <button mat-raised-button class="btn-agregar" (click)="agregarEmpleado()">
        <mat-icon>add</mat-icon>
        Agregar Odontólogo
      </button>
    </div>
  </div>

  <div class="tabla-container mat-elevation-z8">
    <table mat-table *ngIf="dataSource" [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let empleado">{{ empleado.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let empleado">{{ empleado.email }}</td>
      </ng-container>

      <ng-container matColumnDef="opciones">
        <th mat-header-cell *matHeaderCellDef>Opciones</th>
        <td mat-cell *matCellDef="let empleado">
          <div class="botones-opciones">
            <button mat-icon-button class="btn-editar" (click)="editarEmpleado(empleado)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button class="btn-borrar" (click)="eliminarEmpleado(empleado.id)">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="50" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </div>
</div>

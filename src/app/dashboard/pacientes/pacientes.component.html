<div class="pacientes-container">
  <div class="toolbar-header">
    <div class="toolbar-left">
      <h1>Pacientes</h1>
      <span class="badge-count">{{ dataSource.filteredData.length }}</span>
    </div>
    <div class="toolbar-right">
      <mat-form-field appearance="outline" class="buscador">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          (keyup)="aplicarFiltro($event)"
          placeholder="Buscar paciente..."
        />
      </mat-form-field>
      <button mat-raised-button class="btn-agregar" (click)="agregarPaciente()">
        <mat-icon>add</mat-icon>
        Agregar Paciente
      </button>
    </div>
  </div>

  <div class="tabla-container mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort class="tabla">

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let paciente">{{ paciente.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="apellido">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Apellido</th>
        <td mat-cell *matCellDef="let paciente">{{ paciente.apellido }}</td>
      </ng-container>

      <ng-container matColumnDef="dni">
        <th mat-header-cell *matHeaderCellDef>DNI</th>
        <td mat-cell *matCellDef="let paciente">{{ paciente.dni }}</td>
      </ng-container>

      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let paciente">{{ paciente.telefono }}</td>
      </ng-container>   

      <ng-container matColumnDef="obraSocial">
        <th mat-header-cell *matHeaderCellDef>Obra Social</th>
        <td mat-cell *matCellDef="let paciente">{{ paciente.obraSocial }}</td>
      </ng-container>

      <ng-container matColumnDef="opciones">
        <th mat-header-cell *matHeaderCellDef>Opciones</th>
        <td mat-cell *matCellDef="let paciente">
          <div class="botones-opciones">
            <button mat-icon-button class="btn-editar" (click)="editarPaciente(paciente)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button class="btn-borrar" (click)="borrarPaciente(paciente.id)">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="50" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </div>
</div>
